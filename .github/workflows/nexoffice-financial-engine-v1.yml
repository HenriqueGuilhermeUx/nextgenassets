name: NexOffice Financial Engine V1

on:
  pull_request:
    paths:
      - 'apps/api/src/modules/woovi/nexoffice-charge.controller.ts'
      - 'apps/api/src/modules/woovi/woovi-pix-adapter.ts'
      - 'apps/api/src/modules/woovi/woovi.module.ts'
      - 'scripts/smoke-nexoffice-financial-engine-v1.mjs'
      - '.github/workflows/nexoffice-financial-engine-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXOFFICE_FINANCIAL_ACTIONS_ENABLED: 'false'
      NEXOFFICE_SERVICE_KEY: ci-only-service-key
      WOOVI_APP_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run prebuild -w @orkest/api
      - name: Build API
        run: npm run build -w @orkest/api
      - name: Contract smoke
        run: node scripts/smoke-nexoffice-financial-engine-v1.mjs
      - name: External-effect and secret guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "NEXOFFICE_FINANCIAL_ACTIONS_ENABLED || 'false'" apps/api/src/modules/woovi/nexoffice-charge.controller.ts
          grep -q "human_approval_required" apps/api/src/modules/woovi/nexoffice-charge.controller.ts
          ! grep -q "createTransfer(" apps/api/src/modules/woovi/nexoffice-charge.controller.ts
          ! grep -Eq "USDC|PAXG|USDY" apps/api/src/modules/woovi/nexoffice-charge.controller.ts
